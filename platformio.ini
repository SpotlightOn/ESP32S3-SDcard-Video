; PlatformIO project — Spotpear ESP32-S3 1.28" BOX (round GC9A01 LCD) SD card MJPEG player.
;
; Converted from the vendor Arduino IDE package. Libraries come from the
; PlatformIO registry, so the repository carries no library copies.

[platformio]
default_envs = spotpear_esp32s3

[env:spotpear_esp32s3]
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = arduino

; --- Flash layout -------------------------------------------------------
; The board reports 16 MB of flash. 4 MB application slot without OTA,
; the rest is available as SPIFFS.
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 4194304
board_build.f_cpu = 240000000L

; --- Upload / monitor ---------------------------------------------------
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; --- Libraries ----------------------------------------------------------
; All libraries come from the PlatformIO registry, same as in the weather clock
; project, so the repository carries no library copies.
lib_deps =
    ; 1.4.9 is the version the vendor sketch was written against.
    moononournation/GFX Library for Arduino@1.4.9
    ; Current registry release. The API used here (openRAM, setPixelType,
    ; decode, JPEG_SCALE_*) is unchanged from the 1.6 line.
    bitbank2/JPEGDEC@1.8.4

; --- Build options ------------------------------------------------------
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; The board has no USB-UART bridge (USB D-/D+ go to GPIO19/GPIO20),
    ; so Serial only reaches the PC through the native USB CDC.
    -DARDUINO_USB_CDC_ON_BOOT=1

; PSRAM is not available on this board (ESP.getPsramSize() reports 0), so the
; ~115 KB MJPEG buffer is allocated from internal RAM.
