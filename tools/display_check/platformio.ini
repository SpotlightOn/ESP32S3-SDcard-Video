; Standalone panel + SD card check for the Spotpear ESP32-S3 1.28" BOX board.
; Uses the same Arduino_GFX library as the SD video sketch, so a result here
; transfers directly to the player.
;
;   ~/.platformio/penv/bin/pio run -d tools/display_check -t upload
;
; Two envs differ only in the SPI clock: check_40m is the setting the player
; uses, check_80m is the vendor video demo's clock, kept for comparison.

[platformio]
default_envs = check_40m

[env]
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = arduino

lib_deps =
    moononournation/GFX Library for Arduino@1.4.9

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = ../../partitions_16mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 4194304
board_build.f_cpu = 240000000L

upload_speed = 921600
monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:check_40m]
build_flags =
    ${env.build_flags}
    -DLCD_SPI_HZ=40000000

[env:check_80m]
build_flags =
    ${env.build_flags}
    -DLCD_SPI_HZ=80000000
